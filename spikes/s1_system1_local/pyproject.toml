[project]
name = "spike-s1-system1-local"
version = "0.1.0"
description = "Spike S1 : temps de réaction des modèles System 1 en Ollama local"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
