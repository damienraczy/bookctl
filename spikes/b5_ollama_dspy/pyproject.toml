[project]
name = "spike-b5-ollama-dspy"
version = "0.1.0"
description = "Spike B5 : appeler les modèles Ollama Cloud depuis DSPy"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dspy==3.4.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
